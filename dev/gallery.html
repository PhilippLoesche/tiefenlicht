<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<title>Tiefenlicht — Art Gallery</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; padding: 18px 24px 60px; background: #0c111c; color: #cfc6b0; font: 12px/1.35 system-ui, sans-serif; }
  h1 { margin: 0 0 4px; font-size: 20px; color: #ffb454; letter-spacing: .04em; }
  h2 { margin: 26px 0 8px; font-size: 14px; color: #e8dcc0; border-bottom: 1px solid #253048; padding-bottom: 4px; }
  h3 { margin: 12px 0 6px; font-size: 12px; color: #8f9ab4; font-weight: 600; }
  .row { display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: flex-end; }
  .cell { display: flex; flex-direction: column; align-items: center; gap: 3px; }
  .cell span { font-size: 10px; color: #8a93a8; max-width: 110px; text-align: center; word-break: break-all; }
  canvas { display: block; image-rendering: auto; }
  .bg { background: #131a2b; }
  .controls { display: flex; gap: 16px; align-items: center; margin: 6px 0 4px; color: #9aa3b8; }
  .note { color: #6f7a92; }
  .rooms { display: flex; flex-wrap: wrap; gap: 18px; }
  .sizes { display: flex; gap: 6px; align-items: flex-end; padding: 6px; background: #10172a; border-radius: 4px; }
</style>
</head>
<body>
<h1>Tiefenlicht — Art Gallery</h1>
<div class="controls">
  <label><input type="checkbox" id="anim" checked> animate</label>
  <label><input type="checkbox" id="light" checked> light preview on mock rooms (multiply)</label>
  <span class="note" id="stats"></span>
</div>
<div id="root"></div>
<script type="module" src="./gallery.js"></script>
</body>
</html>
